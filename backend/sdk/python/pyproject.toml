[project]
name = "agentguard-sdk"
version = "0.1.0"
description = "AgentGuard Python SDK — intercept agent tool calls behind policy checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentguard"]
